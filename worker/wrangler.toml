name = "mails-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# Custom domain: api.mails0.com → this Worker
routes = [
  { pattern = "api.mails0.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "mails"
database_id = "300b8760-fc02-4b1d-b0c1-bb560ec3b65e"

[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "mails-attachments"

# Workers AI (free tier, for generating embeddings)
[ai]
binding = "AI"

# Vectorize index for semantic search (optional, beta)
# Create once: wrangler vectorize create mails-embeddings --dimensions 768 --metric cosine
[[vectorize]]
binding = "VECTORIZE"
index_name = "mails-embeddings"

# Email Routing: receive emails via email() handler
# The catch-all rule in Cloudflare Dashboard routes *@yourdomain.com → this Worker
[triggers]
send_email = [{ name = "EMAIL" }]
crons = ["0 * * * *"]  # Hourly: clean up old SSE events

# Service binding to mails-gtm-agent (avoids error 1042 on same-account webhook calls)
[[services]]
binding = "MAILS_GTM_WORKER"
service = "mails-gtm-agent"

# Secrets (set via `wrangler secret put`):
#   AUTH_TOKEN      - Legacy single API authentication token (no mailbox isolation)
#   RESEND_API_KEY  - Resend API key for sending emails
#   WEBHOOK_SECRET  - HMAC key for signing webhook payloads
#   ALLOW_PUBLIC_API - Set to "true" only for local/dev to allow unauthenticated /api/*
#
# For mailbox isolation, use the auth_tokens D1 table instead of AUTH_TOKEN:
#   INSERT INTO auth_tokens (token, mailbox) VALUES ('your-token', 'agent@example.com');
#   INSERT INTO auth_tokens (token, mailbox, webhook_url) VALUES ('tok', 'agent@example.com', 'https://...');
