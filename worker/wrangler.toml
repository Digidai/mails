name = "mails-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

account_id = "4b4868590744ff4d63ce6b55c96df01a"
workers_dev = true

# NOTE: openjobs-ai.com is not a zone on this Cloudflare account, so the Worker
# is served on its *.workers.dev URL (no custom domain, no Cloudflare Email
# Routing). Mail is sent AND received via Resend:
#   - Outbound: Resend API (RESEND_API_KEY)
#   - Inbound:  Resend Inbound -> webhook POST /api/resend-webhook
#               (and dedicated /api/resend-inbound), verified by Svix signature
#               using RESEND_WEBHOOK_SECRET.
# To move to a CF custom domain + CF Email Routing later, add the zone to this
# account and restore the `routes` block from wrangler.toml.bak.

[[d1_databases]]
binding = "DB"
database_name = "mails"
database_id = "8f2ecd1d-9ca2-48e1-87b1-bdbea870aee3"

# R2 bucket for large attachments (R2 enabled on account 2026-06-09)
[[r2_buckets]]
binding = "ATTACHMENTS"
bucket_name = "mails-attachments"

# Domain that self-service claimed mailboxes (POST /v1/claim/auto) are created
# under. Without this, claims default to the hosted product's domain.
[vars]
MAILBOX_DOMAIN = "mail.openjobs-ai.com"

# Workers AI (free tier, for generating embeddings)
[ai]
binding = "AI"

# Hourly cron: clean up old SSE events (see scheduled() handler)
[triggers]
crons = ["0 * * * *"]

# Secrets (set via `wrangler secret put`):
#   AUTH_TOKEN            - API authentication token
#   RESEND_API_KEY        - Resend API key for sending + fetching inbound bodies
#   RESEND_WEBHOOK_SECRET - Svix signing secret for the Resend webhook
#                           (delivery events + inbound email.received)
#
# Bindings omitted vs. the upstream config (not available on this account):
#   - Vectorize index        (semantic search; create + add binding later)
#   - MAILS_GTM_WORKER service binding (target Worker not deployed here)
#   - send_email / EMAIL binding (unused; sending goes through Resend)
