name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Deploy mails-worker
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile
        working-directory: worker

      - name: Ensure Vectorize index exists
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          npx wrangler vectorize create mails-embeddings --dimensions 768 --metric cosine --config wrangler.mails0.toml 2>&1 || echo "Vectorize index already exists or creation skipped"

      - name: Apply D1 schema migrations
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          cd worker
          # Normalize legacy hosted DBs first. CREATE TABLE IF NOT EXISTS does
          # not add columns to existing tables, so old auth_tokens/domains/emails
          # tables must be brought up to shape before schema indexes are applied.
          bash scripts/ensure-schema-compat.sh mails wrangler.mails0.toml
          # The canonical schema uses IF NOT EXISTS and is safe to reapply after
          # legacy columns have been normalized. Historical ALTER migrations are
          # intentionally not replayed against production without a migration ledger.
          npx wrangler d1 execute mails --file=schema.sql --remote --config wrangler.mails0.toml

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker
          command: deploy --config wrangler.mails0.toml

      - name: Post-deploy smoke test
        # Wait briefly for the new Worker version to propagate, then run the
        # integration smoke test. This catches deploy-breaking config issues
        # that unit tests can't (e.g. missing secrets, schema drift, routing bugs).
        # If this fails, the whole deploy is marked failed so you notice.
        run: |
          sleep 10
          chmod +x test/integration/api-smoke.sh
          WORKER_URL=https://api.mails0.com \
          CLAIM_URL=https://mails0.com \
          ./test/integration/api-smoke.sh
